name: Postman Tests

on:
  push:
    branches: [ "master", "main" ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Start Spring Boot
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw spring-boot:run "-Dspring-boot.run.profiles=test" &
          
          echo "Waiting for Spring Boot to fully boot..."
          # Bulletproof wait: Actually checks your API endpoint instead of just the port
          timeout 180 bash -c 'until curl --silent --fail http://127.0.0.1:8081/api/v1/items > /dev/null; do echo "Waiting..."; sleep 3; done'
          echo "Server is fully ready!"

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Tests
        # Injects the explicit IPv4 base URL to prevent Node.js IPv6 routing failures
        run: newman run postman/LostAndFound.postman_collection.json --working-dir postman/ --env-var "base_url=http://127.0.0.1:8081/api/v1"