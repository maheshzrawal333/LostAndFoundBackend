# ==============================================================================
# SAFE AUTOMATED TESTING ENVIRONMENT
# ==============================================================================
spring.application.name=LostAndFoundBackend-Test
server.port=8081

# 1. Route database to temporary RAM (Destroys data on shutdown)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# 2. Hardcode a dummy JWT secret so Postman can authenticate
jwt.secret=SuperSecretTestKeyThatIsAtLeast32CharactersLongForHS256
jwt.expiration=86400000

# 3. Disable Real Emails (Prevents spamming during automated tests)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test

# 4. Dummy Cloudinary Config (Prevents context crash on startup)
cloudinary.cloud-name=test-cloud
cloudinary.api-key=123456789
cloudinary.api-secret=test-secret